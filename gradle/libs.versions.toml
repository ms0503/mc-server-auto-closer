[libraries.forge]
module = "net.minecraftforge:forge"
version.ref = "forge"

[libraries.forge-gradle]
module = "net.minecraftforge.gradle:ForgeGradle"
version.ref = "forge-gradle"

[libraries.jetbrains-annotations]
module = "org.jetbrains:annotations"
version.ref = "jetbrains-annotations"

[libraries.kotlin-forge]
# module = "io.github.chaosunity.forgelin:Forgelin-Continuous" # CleanroomMC's Maven repository only has 1.x
module = "maven.modrinth:forgelin-continuous"
version.ref = "kotlin-forge"

[libraries.kotlin-plugin]
module = "org.jetbrains.kotlin:kotlin-gradle-plugin"
version.ref = "kotlin"

[libraries.kotlinx-coroutines-core]
module = "org.jetbrains.kotlinx:kotlinx-coroutines-core"
version.ref = "kotlinx-coroutines-core"

[libraries.minotaur]
module = "com.modrinth.minotaur:com.modrinth.minotaur.gradle.plugin"
version.ref = "minotaur"

[libraries.shadow-plugin]
module = "com.gradleup.shadow:com.gradleup.shadow.gradle.plugin"
version.ref = "shadow"

[plugins.dotenv]
id = "co.uzzu.dotenv.gradle"
version.ref = "dotenv"

[plugins.forge-gradle]
id = "net.minecraftforge.gradle"
version.ref = "forge-gradle"

[versions]
dotenv = "4.0.0"
forge = "1.12.2-14.23.5.2864"
forge-gradle = "6.+"
jetbrains-annotations = "26.1.0"
kotlin = "2.4.20"
kotlin-forge = "2.4.20.0"
kotlinx-coroutines-core = "1.11.0"
minecraft = "1.12.2"
minotaur = "2.+"
shadow = "9.2.+"
